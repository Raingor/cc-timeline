<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐻 自嘲熊 · 我们的纪念时光</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="images/joke-bear.webp" type="image/webp">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ===== 飘浮装饰元素 - 自嘲熊 ===== -->
    <div class="floating-decorations" aria-hidden="true">
        <img src="images/joke-bear.webp" class="deco-bear deco-bear-1" alt="🐻">
        <img src="https://media.tenor.com/IIWFOaA_TfoAAAAj/joke-bear.gif" class="deco-bear deco-bear-2" alt="🐻">
        <img src="https://media.tenor.com/5nzLdhWL7GoAAAAj/sad-bear-joke-bear-sad.gif" class="deco-bear deco-bear-3" alt="🐻">
        <img src="https://media.tenor.com/N-rSTqzfCOEAAAAj/bear-so-cute-funny-point-flower-so-cute.gif" class="deco-bear deco-bear-4" alt="🐻">
        <img src="https://media.tenor.com/pjH4YkUVZTcAAAAj/joke-bear.gif" class="deco-bear deco-bear-5" alt="🐻">
        <img src="https://media.tenor.com/Bz0U_bztQk0AAAAj/plinker98-jokebear.gif" class="deco-bear deco-bear-6" alt="🐻">
    </div>
    
    <!-- 可爱加载动画 -->
    <div id="loading-screen" style="position:fixed;inset:0;z-index:99999;background:var(--bear-bg,#FFF9F2);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s ease;">
        <img src="images/joke-bear.webp" alt="🐻" style="width:120px;height:120px;border-radius:50%;animation:loading-bounce 1.5s ease infinite;margin-bottom:20px;">
        <p style="font-family:var(--font-display);color:var(--bear-brown,#7B5E3F);font-size:1.2rem;letter-spacing:2px;">加载中...</p>
        <style>@keyframes loading-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}</style>
    </div>

    <!-- ===== 月份导航 ===== -->
    <nav class="month-nav" id="monthNav">
        <div class="month-nav-inner">
            <button class="month-nav-btn active" data-month="all">📋 全部</button>
            <button class="month-nav-btn" data-month="3">🌸 3月</button>
            <button class="month-nav-btn" data-month="4">🌿 4月</button>
            <button class="month-nav-btn" data-month="5">☀️ 5月</button>
            <button class="month-nav-btn" data-month="6">💕 6月</button>
            <button class="month-nav-btn" data-month="7">🌙 7月</button>
            <button class="month-nav-btn" data-month="8">🎂 8月</button>
        </div>
    </nav>

    <!-- ===== 顶部 Hero ===== -->
    <header class="hero" id="hero">
        <div class="hero-bg-pattern"></div>
        <div class="hero-content">
            <div class="hero-bear">
                <img src="images/joke-bear.webp" alt="自嘲熊" class="hero-bear-img" loading="eager">
                <div class="hero-bear-shadow"></div>
            </div>
            <h1 class="hero-title">
                <span class="hero-title-line">🐻 自嘲熊</span>
                <span class="hero-title-sub">我们的纪念时光</span>
            </h1>
            <p class="hero-counter" id="days-counter">Loading...</p>
            <p class="hero-quote">「你已经在做得很好了，不必苛责自己」</p>
        </div>
        <div class="hero-wave">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V120L30,105C60,90,120,60,180,45C240,30,300,30,360,37.5C420,45,480,60,540,67.5C600,75,660,75,720,67.5C780,60,840,45,900,37.5C960,30,1020,30,1080,37.5C1140,45,1170,52.5,1200,60L1200,120H0V0Z" fill="var(--dora-bg)"/>
            </svg>
        </div>
    </header>

    <!-- ===== 时间轴主区域 ===== -->
    <main class="main-content">
        <div class="timeline" id="timeline">
            <!-- 由 JS 渲染 -->
        </div>

        <!-- 回到顶部 -->
        <button class="back-to-top" id="backToTop" aria-label="回到顶部">🔝</button>
    </main>

    <!-- ===== Footer ===== -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-characters">
                <img src="https://media.tenor.com/IIWFOaA_TfoAAAAj/joke-bear.gif" class="footer-bear-gif" alt="自嘲熊" loading="lazy">
                <span class="footer-chara footer-heart">💕</span>
                <span class="footer-chara footer-bear-text" aria-label="自嘲熊">🐻</span>
            </div>
            <p class="footer-text">Made with <span class="heart">❤️</span> for CC</p>
            <p class="footer-small">「每一个认真的今天，都是一份礼物」</p>
        </div>
    </footer>

    <!-- ===== 灯箱 ===== -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="关闭">✕</button>
        <button class="lightbox-prev" id="lightbox-prev" aria-label="上一张">‹</button>
        <button class="lightbox-next" id="lightbox-next" aria-label="下一张">›</button>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // 加载完成后隐藏加载动画
        window.addEventListener('load', function() {
            setTimeout(function() {
                var loading = document.getElementById('loading-screen');
                if (loading) {
                    loading.style.opacity = '0';
                    setTimeout(function() {
                        loading.style.visibility = 'hidden';
                    }, 600);
                }
            }, 800);
        });
    </script>
</body>
</html>
